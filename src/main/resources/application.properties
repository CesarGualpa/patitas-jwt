spring.application.name=patitas-jwt

spring.datasource.url=jdbc:postgresql://localhost:5432/patitas_db
spring.datasource.username=${PATITAS_DB_USER}
spring.datasource.password=${PATITAS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true